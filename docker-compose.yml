name: flowforge

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: flowforge
    volumes:
      - pgdata:/var/lib/postgresql/data
    # No host port: postgres is consumed only by other containers in this
    # compose network (via the service name "postgres"). Publishing 5432 would
    # collide with other stacks on this host.
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # No host port: "redis" is consumed only in-network (avoids a 6379 collision
    # with other stacks on this host).
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Materialize the Drizzle schema into Postgres once (idempotent) before any
  # app starts. Reuses the api image; runs `drizzle-kit push`.
  db-init:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: pnpm --filter @flowforge/db db:push
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/flowforge
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/flowforge
      REDIS_URL: redis://redis:6379
      BASE_URL: http://localhost:4000
      # Needed by the executor to encrypt/decrypt stored credentials.
      CREDENTIAL_ENCRYPTION_KEY: dev-only-key-please-override-in-production-32b
      NODE_ENV: production
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/flowforge
      REDIS_URL: redis://redis:6379
      BASE_URL: http://localhost:4000
      EXECUTOR_CONCURRENCY: 5
      CREDENTIAL_ENCRYPTION_KEY: dev-only-key-please-override-in-production-32b
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "80:80"
    depends_on:
      - api

volumes:
  pgdata:
